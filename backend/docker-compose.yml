# Local stand-in for Supabase: Postgres + PostgREST behind a /rest/v1 gateway.
# In production you use your real Supabase project instead (SUPABASE_URL + SUPABASE_SERVICE_KEY).
services:
  db:
    image: postgres:16-alpine
    container_name: clickmart-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: clickmart
      POSTGRES_PASSWORD: clickmart
      POSTGRES_DB: clickmart
    ports:
      - '5433:5432'
    volumes:
      - clickmart-pgdata:/var/lib/postgresql/data
  rest:
    image: postgrest/postgrest:v12.2.3
    container_name: clickmart-rest
    restart: unless-stopped
    depends_on: [db]
    environment:
      PGRST_DB_URI: postgres://authenticator:authenticator@db:5432/clickmart
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: local-dev-jwt-secret-at-least-32-characters-long
      PGRST_DB_MAX_ROWS: '1000'
  gateway:
    image: nginx:alpine
    container_name: clickmart-gateway
    restart: unless-stopped
    depends_on: [rest]
    ports:
      - '54321:80'
    volumes:
      - ./supabase/local/nginx.conf:/etc/nginx/conf.d/default.conf:ro
volumes:
  clickmart-pgdata:
